<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15182a" />
  <title>繩結同行｜昔漣 Discord Activity</title>
</head>
<body>
  <main class="activity-shell">
    <iframe id="game-frame" title="繩結同行" allow="autoplay; fullscreen"></iframe>
    <section id="room-lobby" class="room-lobby" aria-labelledby="room-title">
      <div class="room-card">
        <header>
          <p>CYRENE VOICE LINK · 記憶繩結房</p>
          <span id="room-connection">正在連接同一場 Activity</span>
        </header>
        <div class="room-rope" aria-hidden="true"><i></i><b></b><i></i></div>
        <h1 id="room-title">要和誰一起走？</h1>
        <p id="room-copy">同一個語音房的人可以接住 Player 2；沒有人加入時，昔漣會陪你。</p>
        <div id="room-people" class="room-people" aria-live="polite"></div>
        <div id="room-actions" class="room-actions">
          <button id="room-primary" type="button">準備房間</button>
          <button id="room-solo" type="button">自己開心地玩</button>
        </div>
        <small id="room-note">加入與離開都不會影響其他人的單人進度。</small>
      </div>
    </section>
    <aside id="room-chip" class="room-chip" hidden aria-live="polite"></aside>
    <p id="activity-status" class="sr-only" aria-live="polite">正在準備遊戲</p>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>昔涟 · 状态</title>
  <link rel="stylesheet" href="../ui/tokens.css" />
  <link rel="stylesheet" href="../ui/fonts.css" />
  <link rel="stylesheet" href="../ui/base.css" />
  <link rel="stylesheet" href="./sidebar.css" />
</head>
<body>
  <div class="sidebar">
    <header class="sidebar__titlebar">
      <button type="button" class="sidebar__icon-btn" id="pin-btn" aria-label="置顶" title="置顶">
        <svg width="16" height="16" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g clip-path="url(#pin-icon-clip)"><path d="M10.6963 17.5042C13.3347 14.8657 16.4701 14.9387 19.8781 16.8076L32.62 9.74509L31.8989 4.78683L43.2126 16.1005L38.2656 15.3907L31.1918 28.1214C32.9752 31.7589 33.1337 34.6647 30.4953 37.3032C30.4953 37.3032 26.235 33.0429 22.7171 29.525L6.44305 41.5564L18.4382 25.2461C14.9202 21.7281 10.6963 17.5042 10.6963 17.5042Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></g><defs><clipPath id="pin-icon-clip"><rect width="48" height="48" fill="currentColor"/></clipPath></defs></svg>
      </button>
      <div class="sidebar__title">
        <img class="sidebar__name-avatar" src="../icons/cyrene-avatar-line-white.png" alt="" aria-hidden="true" width="20" height="20" />
        <span class="sidebar__name">昔涟</span>
        <span class="sidebar__hint">状态面板</span>
      </div>
      <div class="sidebar__titlebar-actions">
        <button type="button" class="sidebar__winbtn" id="min-btn" aria-label="最小化" title="最小化">
          <svg width="9" height="2" viewBox="0 0 9 2" aria-hidden="true"><rect width="9" height="2" rx="1" fill="currentColor"/></svg>
        </button>
        <button type="button" class="sidebar__winbtn sidebar__winbtn--close" id="close-btn" aria-label="关闭" title="关闭">
          <svg width="9" height="9" viewBox="0 0 9 9" aria-hidden="true">
            <line x1="2" y1="2" x2="7" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <line x1="7" y1="2" x2="2" y2="7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="sidebar__body">
      <section class="profile">
        <img class="profile__avatar" src="/avatars/cyrene-avatar.png" alt="昔涟" draggable="false" />
        <div class="profile__name">昔涟</div>
        <div class="profile__online">
          <span class="profile__dot" aria-hidden="true"></span>
          <span id="online-status-label">在线</span>
        </div>
      </section>

      <hr class="sidebar__divider" />

      <section class="panel-card panel-card--status">
        <div class="indicator">
          <div class="indicator__emoji" id="status-emoji">✨</div>
          <div class="indicator__text">
            <span class="indicator__prefix">状态：</span>
            <span class="indicator__label" id="status-label">元气</span>
          </div>
        </div>
      </section>

      <section class="panel-card panel-card--feeling">
        <div class="indicator">
          <div class="indicator__emoji" id="feeling-emoji">🥰</div>
          <div class="indicator__text">
            <span class="indicator__prefix">心情：</span>
            <span class="indicator__label" id="feeling-label">开心</span>
          </div>
        </div>
      </section>

      <section class="panel-card model-card">
        <div class="model-feed">
          <span class="model-feed__emoji" aria-hidden="true">🍰</span>
          <span>正在喂养：</span>
          <span class="model-feed__name" id="feeding-model">DeepSeek Chat</span>
        </div>
        <button type="button" class="model-switch-btn" id="open-chat-btn" title="打开聊天">
          <svg class="model-switch-btn__icon" width="15" height="15" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M10 14C10 11.7909 11.7909 10 14 10H34C36.2091 10 38 11.7909 38 14V28C38 30.2091 36.2091 32 34 32H22L14 40V32C11.7909 32 10 30.2091 10 28V14Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><circle cx="17" cy="21" r="2" fill="currentColor"/><circle cx="24" cy="21" r="2" fill="currentColor"/><circle cx="31" cy="21" r="2" fill="currentColor"/></svg>
          <span>打开聊天</span>
        </button>
        <button type="button" class="model-switch-btn" id="call-btn" title="语音通话">
          <svg class="model-switch-btn__icon" width="15" height="15" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M41.7796 20.6066C42.0324 18.9108 41.9495 17.1747 41.5309 15.5054C40.978 13.3002 39.8392 11.2118 38.1147 9.4873C36.3902 7.76281 34.3018 6.62409 32.0967 6.07115C30.4274 5.65257 28.6912 5.56967 26.9954 5.82245" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M34.1896 19.8035C34.4604 17.9869 33.8966 16.0699 32.4982 14.6715C31.0997 13.2731 29.1827 12.7092 27.3662 12.98" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.3755 8.79423C15.1021 8.79423 15.7715 9.18825 16.1241 9.82349L18.5706 14.2303C18.8909 14.8073 18.9059 15.5052 18.6108 16.0955L16.254 20.8091C16.254 20.8091 16.937 24.3206 19.7954 27.179C22.6538 30.0374 26.1535 30.7086 26.1535 30.7086L30.8664 28.3522C31.4571 28.0568 32.1555 28.0721 32.7327 28.393L37.152 30.85C37.7866 31.2028 38.1802 31.8719 38.1802 32.598L38.1802 37.6715C38.1802 40.2552 35.7803 42.1213 33.3322 41.2952C28.3043 39.5987 20.4996 36.3685 15.5528 31.4216C10.6059 26.4748 7.3757 18.6701 5.67916 13.6422C4.85314 11.1941 6.71923 8.79423 9.30288 8.79423L14.3755 8.79423Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
          <span>语音通话</span>
        </button>
        <button type="button" class="model-switch-btn" id="model-switch-btn" title="切换模型">
          <svg class="model-switch-btn__icon" width="15" height="15" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M42 8V24" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 24L6 40" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 24C42 14.0589 33.9411 6 24 6C18.9145 6 14.3216 8.10896 11.0481 11.5M6 24C6 33.9411 14.0589 42 24 42C28.8556 42 33.2622 40.0774 36.5 36.9519" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>切换模型</span>
        </button>
      </section>

      <section class="panel-card action-card">
        <button type="button" class="settings-btn" id="settings-btn" title="打开设置">
          <svg class="settings-btn__icon" width="15" height="15" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M18.2838 43.1713C14.9327 42.1736 11.9498 40.3213 9.58787 37.867C10.469 36.8227 11 35.4734 11 34.0001C11 30.6864 8.31371 28.0001 5 28.0001C4.79955 28.0001 4.60139 28.01 4.40599 28.0292C4.13979 26.7277 4 25.3803 4 24.0001C4 21.9095 4.32077 19.8938 4.91579 17.9995C4.94381 17.9999 4.97188 18.0001 5 18.0001C8.31371 18.0001 11 15.3138 11 12.0001C11 11.0488 10.7786 10.1493 10.3846 9.35011C12.6975 7.1995 15.5205 5.59002 18.6521 4.72314C19.6444 6.66819 21.6667 8.00013 24 8.00013C26.3333 8.00013 28.3556 6.66819 29.3479 4.72314C32.4795 5.59002 35.3025 7.1995 37.6154 9.35011C37.2214 10.1493 37 11.0488 37 12.0001C37 15.3138 39.6863 18.0001 43 18.0001C43.0281 18.0001 43.0562 17.9999 43.0842 17.9995C43.6792 19.8938 44 21.9095 44 24.0001C44 25.3803 43.8602 26.7277 43.594 28.0292C43.3986 28.01 43.2005 28.0001 43 28.0001C39.6863 28.0001 37 30.6864 37 34.0001C37 35.4734 37.531 36.8227 38.4121 37.867C36.0502 40.3213 33.0673 42.1736 29.7162 43.1713C28.9428 40.752 26.676 39.0001 24 39.0001C21.324 39.0001 19.0572 40.752 18.2838 43.1713Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M24 31C27.866 31 31 27.866 31 24C31 20.134 27.866 17 24 17C20.134 17 17 20.134 17 24C17 27.866 20.134 31 24 31Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
          <span class="settings-btn__text">设置</span>
        </button>
      </section>

      <hr class="sidebar__divider" />

      <div class="sidebar__version">昔涟 v0.9.0</div>
    </main>
  </div>
  <script type="module" src="./sidebar.ts"></script>
</body>
</html>
